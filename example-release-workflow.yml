name: Upload to CFX Portal on Release

on:
  release:
    types: [created]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # WAŻNE: Najpierw checkout repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # Teraz możesz użyć akcji CFX Portal Upload
      - name: Upload to CFX Portal
        uses: koja/cfx-portal-upload@main # lub @v1, zależnie od wersji
        with:
          cookie: ${{ secrets.CFX_COOKIE }}
          escrowed: |
            asset_id: "737812"
            asset_name: "lspd-eup-pack-escrowed"
            escrow_ignore: ['init.lua', 'shared/config.lua']
          openSource: |
            asset_id: "737811"
            asset_name: "lspd-eup-pack-opensource"
