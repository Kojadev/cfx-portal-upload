name: Upload Assets to CFX Portal

on:
  release:
    types: [created]

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload to CFX Portal
        uses: Kojadev/cfx-portal-upload@main
        with:
          cookie: ${{ secrets.FORUM_COOKIE }}
          assetId: '737812' # ID assetu dla EUP pack
          assetName: 'LSPD_EUP_PACK_V2'
          makeZip: true
